services:

  # ------------------------------------------------------------
  #                Incoming and outgoing endpoints
  # ------------------------------------------------------------
  knfapp-endpoint:
    container_name: knfapp-endpoint
    image: caddy:2.11-alpine
    # user: 1000:1000
    read_only: true
    ports:
      - "80:80"
    volumes:
      - ./endpoint/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - isolated
      - external
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------







  # ------------------------------------------------------------
  #                  KNFAPP server side stack
  # ------------------------------------------------------------
  knfapp-vite:
    container_name: knfapp-vite

    # Self-built
    image: knfapp-vite
    build:
      context: ./vite
      # dockerfile: Dockerfile                                                         # Prod
      dockerfile: Dockerfile.dev                                                     # Dev

    # user: 1000:1000
    read_only: true
    tmpfs:                                                                           # Dev
      - /home/node/.npm                                                              # Dev
    volumes:                                                                         # Dev
      - ./vite/app:/app                                                              # Dev
    networks:
      - isolated
      - external                                                                     # Dev
    restart: unless-stopped


  # knfapp-backend:
  #   container_name: knfapp-backend
  #   build: ./backend
  #   # user: 1000:1000
  #   read_only: true
  #   environment:
  #     # - APP_DEBUG=true                                                     # Dev
  #     - SECRET_KEY=${SECRET_KEY}
  #     - JWT_SECRET=${JWT_SECRET}
  #     - DB_PATH=/data/knfapp.db
  #     - UPLOAD_DIR=/data/uploads
  #     - INVITATION_EXPIRY_HOURS=${INVITATION_EXPIRY_HOURS:-168}
  #     - ALLOWED_ORIGINS=https://knfapp.knf-hosting.lt,http://localhost,http://localhost:8081,http://localhost:8083   # socket.io checks Origin even same-origin
  #   tmpfs:
  #     - /tmp:uid=1000,gid=1000
  #   volumes:
  #     - /etc/localtime:/etc/localtime:ro
  #     - ./_DATA/backend:/data
  #   networks:
  #     - isolated
  #     - external
  #   restart: unless-stopped



  knfapp-django:
    container_name: knfapp-django

    # Self-built
    image: knfapp-django
    build: ./django

    # user: 1000:1000
    read_only: true
    environment:
      - DJANGO_DEBUG=True                                                            # Dev
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgres://knfapp:knfapp@knfapp-postgres:5432/knfapp
      - UPLOAD_DIR=/data/uploads
      - MEMES_DIR=/data/memes
    tmpfs:
      - /tmp
      - /.gunicorn
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./django:/app                                                                # Dev
      - ./_DATA/django:/data
    networks:
      - isolated
      - external
    restart: unless-stopped



  knfapp-postgres:
    container_name: knfapp-postgres
    image: postgres:17.2-alpine
    user: 1000:1000
    read_only: true
    environment:
      POSTGRES_DB: knfapp
      POSTGRES_USER: knfapp
      POSTGRES_PASSWORD: knfapp
      PGDATA: /var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
    tmpfs:
      - /var/run/postgresql
      - /tmp
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./_DATA/postgres:/var/lib/postgresql/data
    networks:
      - isolated
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------











  # ------------------------------------------------------------
  #               KNFAPP Development Environment
  # ------------------------------------------------------------
  knfapp-mobile:
    container_name: knfapp-mobile
    image: knfapp-mobile
    build: ./mobile
    # user: 1000:1000
    # read_only: true
    tty: true
    stdin_open: true
    environment:
      - EXPO_NO_TELEMETRY=1
      - EXPO_PUBLIC_API_URL=https://knfapp.knf-hosting.lt/api
      - REACT_NATIVE_PACKAGER_HOSTNAME=knfapp.knf-hosting.lt
      - EXPO_PACKAGER_PROXY_URL=https://knfapp.knf-hosting.lt
      - EXPO_MANIFEST_PROXY_URL=https://knfapp.knf-hosting.lt
      - EXPO_TOKEN=${EXPO_TOKEN}  
    volumes:
      - ./mobile/app:/app
    networks:
      - isolated
      - external
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------













