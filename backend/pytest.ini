# -----------------------------------------------------------
#  [*] pytest configuration
#
#  testpaths pins the suite to app/tests so a bare `pytest`
#  never wanders into the scrapers' own modules; the strict
#  flags turn a typo'd marker or an unraised warning into a
#  failure instead of a silent pass.
# -----------------------------------------------------------

[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config -p no:cacheprovider
markers =
    slow: takes noticeable wall-clock time (retention sweeps, large pages)
    contract: pins a wire shape the production mobile app consumes
